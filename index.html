<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartDesk+ Self Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap">
<style>
/* =====================================================================
   Tokens copied from src/theme/theme.js (MUI palette, light + dark)
   ===================================================================== */
:root{
  --primary:#7352c7; --primary-light:#886CCF; --primary-dark:#6246A9; --primary-lighter:#EAE5F7; --th-text:#453177;
  --primary-a06:rgba(115,82,199,.06); --primary-a08:rgba(115,82,199,.08); --primary-a14:rgba(115,82,199,.14); --primary-a16:rgba(115,82,199,.16); --primary-a20:rgba(115,82,199,.2); --primary-a24:rgba(115,82,199,.24); --primary-a50:rgba(115,82,199,.5);
  --secondary:#4C763B; --secondary-a50:rgba(76,118,59,.5); --secondary-a04:rgba(76,118,59,.04);
  --bg:#F5F7FA; --paper:#FFFFFF; --text:#0F1724; --text2:#6B7280; --text-disabled:rgba(0,0,0,.38); --divider:#EAE9FF;
  --success:#22C55E; --ok-ink:#15803d; --info:#42A5F5; --warning:#F59E0B; --error:#E53935;
  --in-border:rgba(0,0,0,.23); --in-hover:rgba(0,0,0,.87); --hover:rgba(0,0,0,.04); --row-hover:rgba(0,0,0,.03);
  --grey300:#e0e0e0; --grey400:#bdbdbd;
  --info-bg:#ECF6FE; --info-ink:#1A4262; --warn-bg:#FEF5E7; --warn-ink:#623F04;
  --ro-bg:rgba(148,163,184,.12); --ro-border:rgba(148,163,184,.35);
  --sel-text:#6246A9; --track:#e0e0e0; --thumb:#fff;
  --shadow-card:0px 4px 20px rgba(0,0,0,.05); --shadow-float:0 10px 24px rgba(0,0,0,.18); --shadow-quick:0px 1px 0px rgba(16,24,40,.04);
  --shadow-menu:0px 5px 5px -3px rgba(0,0,0,.2),0px 8px 10px 1px rgba(0,0,0,.14),0px 3px 14px 2px rgba(0,0,0,.12);
  --shadow-btn:0px 3px 1px -2px rgba(0,0,0,.2),0px 2px 2px 0px rgba(0,0,0,.14),0px 1px 5px 0px rgba(0,0,0,.12);
  font-family:'Roboto',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1020; --paper:#0E1724; --text:#E6EEF8; --text2:#A8B3C6; --text-disabled:rgba(255,255,255,.5); --divider:rgba(255,255,255,.06);
    --in-border:rgba(255,255,255,.23); --in-hover:#fff; --hover:rgba(255,255,255,.08); --row-hover:rgba(255,255,255,.04);
    --grey300:rgba(255,255,255,.12); --grey400:rgba(255,255,255,.3);
    --info-bg:#071119; --info-ink:#B3DBFB; --warn-bg:#191001; --warn-ink:#FBD89D;
    --sel-text:#886CCF; --ok-ink:#7ee2a3; --track:#616161; --thumb:#0E1724;
    --primary-a14:rgba(115,82,199,.24); --primary-a08:rgba(115,82,199,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1020; --paper:#0E1724; --text:#E6EEF8; --text2:#A8B3C6; --text-disabled:rgba(255,255,255,.5); --divider:rgba(255,255,255,.06);
  --in-border:rgba(255,255,255,.23); --in-hover:#fff; --hover:rgba(255,255,255,.08); --row-hover:rgba(255,255,255,.04);
  --grey300:rgba(255,255,255,.12); --grey400:rgba(255,255,255,.3);
  --info-bg:#071119; --info-ink:#B3DBFB; --warn-bg:#191001; --warn-ink:#FBD89D;
  --sel-text:#886CCF; --ok-ink:#7ee2a3; --track:#616161; --thumb:#0E1724;
  --primary-a14:rgba(115,82,199,.24); --primary-a08:rgba(115,82,199,.16);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.43;font-family:inherit;transition:background-color .2s linear,color .2s linear}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary-a50);outline-offset:2px}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.muted{color:var(--text2)}
.b{font-weight:700}

/* ---------- MUI Button ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:6px 16px;min-height:36.5px;font-size:14px;font-weight:500;letter-spacing:.02857em;text-transform:uppercase;cursor:pointer;background:none;transition:background-color .25s,box-shadow .25s,border-color .25s;line-height:1.75}
.btn svg.i{width:20px;height:20px}
.btn-lg{padding:8px 22px;font-size:15px;min-height:42px}
.btn-sm{padding:4px 10px;font-size:13px;min-height:30.75px}
.btn-sm svg.i{width:18px;height:18px}
.btn-contained{background:var(--primary);color:#fff;box-shadow:var(--shadow-btn)}
.btn-contained:hover{background:var(--primary-dark)}
.btn-outlined{border:1px solid var(--primary-a50);color:var(--primary);padding:5px 15px}
.btn-outlined:hover{border-color:var(--primary);background:var(--primary-a06)}
.btn-outlined.btn-lg{padding:7px 21px}
.btn-outlined.btn-sm{padding:3px 9px}
.btn-secondary{border:1px solid var(--secondary-a50);color:var(--secondary)}
.btn-secondary:hover{border-color:var(--secondary);background:var(--secondary-a04)}
.btn-text{color:var(--primary);padding:6px 8px}
.btn-text:hover{background:var(--primary-a06)}
.btn[disabled]{background:rgba(0,0,0,.12);color:rgba(0,0,0,.26);box-shadow:none;cursor:default}
.full{width:100%}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--text2);position:relative;transition:background-color .15s}
.icon-btn:hover{background:var(--hover)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm svg.i{width:20px;height:20px}
.link{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font-size:14px;text-decoration:underline;text-decoration-color:rgba(115,82,199,.4);text-underline-offset:2px}
.link:hover{text-decoration-color:currentColor}
.link.hover{text-decoration:none}.link.hover:hover{text-decoration:underline}

/* ---------- Layout.jsx ---------- */
.layout{min-height:100vh;display:flex;flex-direction:column;padding:8px}
.toolbar{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding-inline:24px}
.menu-btn{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:8px;display:grid;place-items:center;cursor:pointer;margin-left:-12px}
.menu-btn:hover{background:var(--primary-dark)}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.hi{text-align:right;margin-right:8px;display:grid}
.hi b{font-size:16px;line-height:1.5}
.hi small{font-size:12px;color:var(--text2);line-height:1.66;letter-spacing:.03333em}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:20px;border:0;cursor:pointer;margin-left:8px}
.badge{position:absolute;top:2px;right:0;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--error);color:#fff;font-size:12px;font-weight:500;display:grid;place-items:center;line-height:1}
.content{flex:1;padding-inline:40px;padding-block:40px}
.footer{text-align:center;padding:8px;font-size:14px}

/* Popover menus */
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 4px);background:var(--paper);border-radius:16px;box-shadow:var(--shadow-menu);padding:8px 0;min-width:160px;z-index:30;display:none}
.pop.open{display:block;animation:pop .15s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.pop.center{right:0}
.pop.center.open{animation:none}
.pop.right{right:0}
#pop-user{min-width:230px;padding:8px}
#pop-user .mi{align-items:center;white-space:nowrap;border-radius:8px;padding:8px 14px;font-size:15px}
.mi{display:flex;align-items:center;width:100%;border:0;background:none;padding:6px 16px;min-height:36px;font-size:16px;cursor:pointer;text-align:left;color:var(--text)}
.mi:hover{background:var(--hover)}
.mi svg.i{width:20px;height:20px;margin-right:20px}
.mi.static{cursor:default}
.mi.static:hover{background:none}
.pop hr{border:0;border-top:1px solid var(--divider);margin:8px 0}
.notif{width:340px;padding:0;border-radius:8px;overflow:hidden}
.notif-h{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--divider);display:flex;justify-content:space-between;align-items:center}
.notif-i{padding:12px 16px;border-bottom:1px solid var(--divider);cursor:pointer;display:grid;gap:2px;font-size:13.5px}
.notif-i:hover{background:var(--row-hover)}
.notif-i small{color:var(--text2);font-size:12px}
.notif-i:last-child{border-bottom:0}

/* Floating vertical theme switch (Header.jsx) */
.theme-float{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:1600;width:0;height:0;display:flex;align-items:center;justify-content:center;animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-50%) translateY(-8px)}}
.switch{flex:none;transform:rotate(-90deg);width:80px;height:40px;border:0;background:none;padding:3px;cursor:pointer;position:relative}
.switch .track{position:absolute;inset:3px;border-radius:999px;background:var(--track);border:1px solid var(--grey300);transition:background-color .18s}
.switch .thumb{position:absolute;top:5px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--thumb);border:1px solid var(--grey300);display:grid;place-items:center;transition:transform .18s cubic-bezier(.4,0,.2,1)}
.switch .thumb svg{width:14px;height:14px;fill:var(--primary)}
.switch[aria-checked="true"] .track{background:var(--primary);border-color:var(--primary)}
.switch[aria-checked="true"] .thumb{transform:translateX(38px) rotate(10deg);border-color:var(--primary)}

/* Sidebar.jsx drawer */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1200;opacity:0;pointer-events:none;transition:opacity .225s}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:360px;max-width:100vw;z-index:1201;background:var(--paper);background-image:linear-gradient(180deg,var(--primary-a08) 0%,var(--paper) 28%,var(--paper) 100%);border-right:1px solid var(--primary-a16);box-shadow:10px 0 30px rgba(40,30,90,.14);transform:translateX(-105%);transition:transform .225s cubic-bezier(0,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-head{padding:16px 16px 12px;display:flex;align-items:center}
.dr-head img{max-width:132px;margin:0 auto;display:block}
.dr-close{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary-a08);border:1px solid var(--primary-a20);cursor:pointer;color:var(--text2)}
.dr-close:hover{background:var(--primary-a16)}
.dr-close svg.i{width:20px;height:20px}
.dr-search{margin:7px 16px 15px;padding:6.4px 12.8px;display:flex;align-items:center;gap:8px;border-radius:17.6px;border:1px solid var(--primary-a24);background:var(--primary-a06)}
.dr-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-a14)}
.dr-search svg.i{width:18px;height:18px;color:var(--text2)}
.dr-search input{border:0;background:none;outline:none;width:100%;font-size:14px;padding:4px 0}
.dr-list{padding:0 3px;overflow-y:auto}
.nav-item{position:relative;display:flex;align-items:center;width:calc(100% - 16px);margin:0 8px 3.6px;padding:8px 8px 8px 10px;border-radius:16px;border:0;background:transparent;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--primary-a08)}
.nav-item svg.i{color:var(--text2);opacity:.9;margin-right:12px}
.nav-item span{font-size:13px;font-weight:500;color:var(--text2)}
.nav-item.sel{background:var(--primary-a14)}
.nav-item.sel svg.i,.nav-item.sel span{color:var(--sel-text);opacity:1}
.nav-item.sel span{font-weight:700}
.nav-item.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:4px;background:var(--primary)}
.nav-empty{padding:16px 24px;font-style:italic;color:var(--text2)}

/* ---------- Snackbar + Alert (MUI) ---------- */
.snack{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:1400;max-width:calc(100% - 32px)}
.alert{display:flex;gap:12px;padding:6px 16px;border-radius:8px;font-size:14px;line-height:1.43;align-items:flex-start}
.alert .a-ic{padding:7px 0;display:flex}
.alert .a-ic svg.i{width:22px;height:22px}
.alert .a-msg{padding:8px 0;min-width:0;overflow-wrap:anywhere}
.alert .a-x{margin-left:auto;padding:4px 0 0 16px}
.alert .a-x button{border:0;background:none;color:inherit;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;opacity:.9}
.alert .a-x button:hover{background:rgba(0,0,0,.08)}
.alert .a-x svg.i{width:20px;height:20px}
.alert-filled{box-shadow:0px 3px 5px -1px rgba(0,0,0,.2),0px 6px 10px 0px rgba(0,0,0,.14),0px 1px 18px 0px rgba(0,0,0,.12);font-weight:500;animation:snackIn .2s ease-out}
@keyframes snackIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.alert-filled.success{background:var(--success);color:rgba(0,0,0,.87)}
.alert-filled.error{background:var(--error);color:#fff}
.alert-info{background:var(--info-bg);color:var(--info-ink);border:1px solid var(--info);border-radius:16px}
.alert-info .a-ic{color:var(--info)}
.alert-warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:16px}
.alert-warn .a-ic{color:var(--warning)}
.a-title{font-weight:700;font-size:16px;margin:-2px 0 4px;line-height:1.5}

/* ---------- Login.jsx ---------- */
.login{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(136,108,207,.125),var(--bg));display:flex;align-items:center;justify-content:center;padding:16px}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;pointer-events:none}
.login-paper{width:100%;max-width:550px;border-radius:32px;padding:32px;z-index:1;background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.15);display:grid;gap:24px}
.login-paper .logo{width:250px;max-width:100%;margin:0 auto 16px;display:block}
.or{display:flex;align-items:center;gap:16px;color:var(--text);font-size:16px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--divider)}

/* Header role switch (End User / Support) */
.role-sw{display:inline-flex;border:1px solid var(--primary-a50);border-radius:8px;overflow:hidden;margin-right:8px}
.role-sw button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 12px;font-size:13px;font-weight:500;letter-spacing:.02857em;text-transform:uppercase;color:var(--primary);cursor:pointer;line-height:1.5}
.role-sw button+button{border-left:1px solid var(--primary-a50)}
.role-sw button svg.i{width:18px;height:18px}
.role-sw button:hover{background:var(--primary-a06)}
.role-sw button[aria-pressed="true"]{background:var(--primary);color:#fff;cursor:default}

/* MUI outlined TextField with floating label */
.tf{position:relative}
.tf input{width:100%;height:56px;padding:16.5px 14px;font-size:16px;border:1px solid var(--in-border);border-radius:8px;background:transparent;outline:none;transition:border-color .15s}
.tf input:hover{border-color:var(--in-hover)}
.tf input:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.tf label{position:absolute;left:10px;top:28px;transform:translateY(-50%);padding:0 4px;background:var(--paper);color:var(--text2);font-size:16px;pointer-events:none;transition:all .2s cubic-bezier(0,0,.2,1)}
.tf input:focus+label,.tf input:not(:placeholder-shown)+label{top:0;font-size:12px}
.tf input:focus+label{color:var(--primary)}
.tf .reveal{position:absolute;right:8px;top:28px;transform:translateY(-50%)}
.tf input[type=password]::-ms-reveal{display:none}

/* ---------- Page containers ---------- */
.container{max-width:1200px;margin:0 auto}
.container-800{max-width:800px;margin:0 auto}
.stack{display:grid;gap:24px}
.stack-16{display:grid;gap:16px}
.grid{display:grid;gap:24px}

/* SelfServicePortal home */
.hero{display:grid;gap:16px;justify-items:center;margin-bottom:32px}
.hero h1{font-weight:700;font-size:34px;text-align:center;text-wrap:balance}
.search-wrap{position:relative;width:100%;max-width:640px}
.ts{display:flex;align-items:center;height:56px;padding:0 14px;border:1px solid var(--divider);border-radius:8px;background:var(--paper)}
.ts:focus-within{border:2px solid var(--primary);padding:0 13px}
.ts input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0}
.ts svg.i{color:var(--text2)}
.ts-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;border-radius:8px;border:1px solid var(--divider);background:var(--paper);max-height:420px;overflow-y:auto}
.ts-res .h{padding:10px;font-weight:700;font-size:14px;border-bottom:1px solid var(--divider)}
.ts-item{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:6px;cursor:pointer;margin:4px}
.ts-item:hover{background:var(--row-hover)}
.ts-item b{font-size:13px;color:var(--primary)}
.ts-item div{min-width:0}
.ts-item p{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-item small{font-size:12px;color:var(--text2);white-space:nowrap}

.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin-bottom:40px}
.qcard{width:calc((100% - 96px)/5);min-width:200px;cursor:pointer;border-radius:16px;border:1px solid var(--divider);background:var(--paper);box-shadow:var(--shadow-quick);transition:transform .16s ease,box-shadow .16s ease;padding:24px;display:grid;gap:12px;justify-items:center;text-align:center}
.qcard:hover{transform:translateY(-2px);box-shadow:0px 10px 22px rgba(16,24,40,.10)}
.qcard .circle{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
.qcard .circle svg.i{width:28px;height:28px}
.qcard b{font-weight:700}
.qcard p{white-space:pre-line;font-size:13.5px;color:var(--text2);line-height:1.35}
.sec-title{font-weight:700;font-size:24px;margin-bottom:16px}
.home-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}

/* CardContainer.jsx */
.cc{background:var(--paper);border-radius:8px;box-shadow:var(--shadow-card);transition:box-shadow .3s}
.cc:hover{box-shadow:0px 6px 24px rgba(0,0,0,.08)}
.cc-head{padding:24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--divider);flex-wrap:wrap}
.cc-head h2{font-size:20px;font-weight:500;line-height:1.6;min-width:0}
.cc-head .icon-btn:hover{color:var(--primary);background:transparent}
.cc-body{padding:24px;overflow-x:auto}

/* DataTable.jsx */
.dt-bar{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.dt-search{position:relative;min-width:220px}
.dt-search .box{display:flex;align-items:center;height:30.5px;border:1px solid var(--in-border);border-radius:8px;padding:0 4px 0 6px}
.dt-search .box:hover{border-color:var(--in-hover)}
.dt-search .box:focus-within{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.dt-search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px;padding:0 4px}
.dt-search svg.i{width:22px;height:22px;color:var(--text2)}
.dt-search .help{position:absolute;top:31px;left:0;font-size:11px;color:var(--text2);line-height:1}
.btn-group{display:inline-flex}
.dt-filter{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:16px;border:1px solid var(--divider);border-radius:8px;margin:-8px 0 20px}
.sel-f{display:grid;gap:4px;font-size:12px;color:var(--text2)}
.sel-f select{height:36px;border:1px solid var(--in-border);border-radius:8px;background:var(--paper);padding:0 10px;font-size:14px;min-width:180px;color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-12px 0 16px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 10px;border-radius:12px;background:rgba(0,0,0,.08);font-size:13px}
:root[data-theme="dark"] .chip{background:rgba(255,255,255,.16)}
.chip button{border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--text2);padding:0}
.chip svg.i{width:16px;height:16px}
.tbl{max-height:calc(100vh - 220px);overflow:auto;border:1px solid var(--divider);border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;min-width:720px}
thead th{position:sticky;top:0;z-index:2;background:var(--primary-lighter);color:var(--th-text);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;text-align:left;vertical-align:top;border-bottom:2px solid var(--primary);line-height:1.5}

/* Becky chat card (Information / CommentList card style) */
.fcard{padding:20px;border-radius:16px;background:var(--paper);border:1px solid var(--divider);box-shadow:var(--shadow-float)}
.fcard-title{font-size:16px;font-weight:800;line-height:1.75}
.divider{border:0;border-top:1px solid var(--divider);margin:16px 0}
.chat{display:flex;flex-direction:column;height:620px}
.chat-head{display:flex;gap:12px;align-items:center}
.bot{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}

.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:8px}

.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5}
.msg p+p,.msg p+ol,.msg ol+p{margin-top:6px}
.msg ol{margin:4px 0 0;padding-left:18px}
.msg.bot-m{background:var(--bg);border:1px solid var(--divider);border-top-left-radius:4px;align-self:flex-start}
.msg.user-m{background:var(--primary);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.msg .src{margin-top:8px;font-size:12.5px;color:var(--text2)}
.msg .src .link{font-size:12.5px}
.typing{display:inline-flex;gap:4px;padding:14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.prompts .lbl{width:100%;font-size:12px;color:var(--text2);font-weight:600}
.mchip{height:auto;min-height:32px;padding:5px 12px;border-radius:16px;border:1px solid var(--grey400);background:none;font-size:13px;cursor:pointer;color:var(--text);text-align:left;line-height:1.35}
.mchip:hover{background:var(--hover)}
.mchip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.composer{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;height:40px;padding:8.5px 14px;border:1px solid var(--in-border);border-radius:8px;background:transparent;font-size:16px;outline:none}
.composer input:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.composer .btn{min-width:0;width:40px;height:40px;padding:0}
.chat-head .icon-btn{margin-left:auto}
.home-grid.chat-off{grid-template-columns:minmax(0,1fr)}
.chat-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:8px 18px 8px 8px;background:var(--primary);color:#fff;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 6px 18px rgba(115,82,199,.35);animation:fabIn .2s ease-out}
.chat-fab:hover{background:var(--primary-dark)}
.chat-fab .bot{background:rgba(255,255,255,.18);width:34px;height:34px}
.chat-fab .dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 2px var(--primary)}
.chat-float{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:1300;width:min(440px, calc(100vw - 32px));height:min(680px, calc(100vh - 40px));animation:floatIn .2s ease-out;transform-origin:bottom right}
.chat-float .chat{height:100%;box-shadow:0 18px 48px rgba(0,0,0,.25)}
#app.pop-open .theme-float{display:none}
@keyframes floatIn{from{transform:scale(.92) translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:600px){.chat-float{right:8px;left:8px;width:auto;bottom:8px;height:calc(100vh - 16px)}}
@keyframes fabIn{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
/* ---------- Chat v2 ---------- */
.chat.fcard{padding:0;overflow:hidden}
.chat-top{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;flex:none}
.chat-top .bot{background:rgba(255,255,255,.2);position:relative}
.chat-top .t{font-weight:700;font-size:16px;line-height:1.3}.chat-top .t .sep{opacity:.55;font-weight:400;margin:0 2px}
.chat-top .s{font-size:12.5px;opacity:.88}
.chat-top .acts{margin-left:auto;display:flex;gap:2px}
.chat-top .icon-btn{color:#fff;width:34px;height:34px}
.chat-top .icon-btn:hover{background:rgba(255,255,255,.16)}
.chat-top .icon-btn svg.i{width:20px;height:20px}
.chat .msgs{padding:16px 14px 10px;gap:14px}
.crow{display:flex;gap:8px;align-items:flex-start;animation:msgIn .2s ease-out}
.crow.is-user{justify-content:flex-end}
.chat .msgs>*{flex-shrink:0}
.crow.is-bot>div:last-child{flex:1;min-width:0;padding-right:18px}

.crow.is-user>div{max-width:85%}
.crow.is-user>div{display:grid;justify-items:end}
.cav{width:28px;height:28px;border-radius:50%;background:var(--primary-a14);color:var(--primary);display:grid;place-items:center;flex:none;margin-top:2px}
.cav svg.i{width:17px;height:17px}
.chat .msg{max-width:100%}
.meta{font-size:11.5px;color:var(--text2);margin-top:4px;display:flex;align-items:center;gap:6px;padding:0 2px;min-height:20px}
.fb{display:inline-flex;align-items:center;gap:2px;margin-left:4px}
.fbb{border:0;background:none;padding:3px;border-radius:6px;cursor:pointer;color:var(--text2);display:grid;place-items:center}
.fbb:hover{background:var(--hover);color:var(--primary)}
.fbb svg.i{width:14px;height:14px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg .mchip{border-color:var(--primary-a50);color:var(--primary);font-size:12.5px;min-height:28px;padding:4px 10px}
.sugg .mchip:hover{background:var(--primary-a06)}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topics .lbl{font-size:12px;font-weight:600;color:var(--text2);margin:2px 0 8px 36px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-left:36px}
.topic{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--divider);border-radius:12px;background:var(--paper);cursor:pointer;font-size:13px;font-weight:500;text-align:left;color:var(--text);line-height:1.3;transition:border-color .15s,background .15s,transform .15s}
.topic:hover{border-color:var(--primary);background:var(--primary-a06);transform:translateY(-1px)}
.ti{width:28px;height:28px;border-radius:8px;background:var(--primary-a08);color:var(--primary);display:grid;place-items:center;flex:none}
.ti svg.i{width:16px;height:16px}
.nudge{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px;display:grid;gap:4px}
.nudge .link{font-size:13px;justify-self:start}
.rc{margin-top:8px;border:1px solid var(--divider);border-radius:10px;background:var(--paper);padding:10px 12px;display:grid;gap:4px}
.rc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc-h b{color:var(--primary);font-size:13px}
.rc-t{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-n{font-size:12.5px;color:var(--text2);border-left:3px solid var(--primary-a24);padding-left:8px;margin-top:4px;line-height:1.45}
.rc-n b{color:var(--text);font-weight:600}
.rc-a{justify-self:start;border:0;background:none;color:var(--primary);font-weight:500;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 0}
.rc-a svg.i{width:14px;height:14px}
.spill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.spill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.spill.info{background:var(--info-bg);color:var(--info-ink)}
.spill.pri{background:var(--primary-a14);color:var(--sel-text)}
.spill.ok{background:rgba(34,197,94,.15);color:var(--ok-ink)}
.spill.mute{background:var(--hover);color:var(--text2)}
.kbsrc{margin-top:8px;width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--divider);border-radius:10px;background:var(--paper);padding:8px 10px;cursor:pointer;text-align:left;color:var(--text)}
.kbsrc:hover{border-color:var(--primary)}
.kbsrc .kt{flex:1;min-width:0;display:grid}
.kbsrc small{font-size:11px;color:var(--text2)}
.kbsrc b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbsrc>svg.i{width:16px;height:16px;color:var(--primary)}
.cta{margin-top:10px}
.opt-note{margin-top:6px;font-size:12.5px;color:var(--text2)}
.flows{display:grid;gap:8px;margin-left:36px}
.flow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--divider);border-radius:12px;background:var(--paper);cursor:pointer;text-align:left;color:var(--text);transition:border-color .15s,background .15s,transform .15s}
.flow:hover{border-color:var(--primary);background:var(--primary-a06);transform:translateY(-1px)}
.flow .fi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.flow .fi svg.i{width:20px;height:20px}
.flow b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.flow small{display:block;color:var(--text2);font-size:12.5px;line-height:1.35}
.flow>svg.i{margin-left:auto;width:18px;height:18px;color:var(--text2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:4px}
.dl span{color:var(--text2)}
.dl b{font-weight:500;overflow-wrap:anywhere}
.dact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.att-btn{flex:none;width:42px;height:42px;border-radius:12px}
.att-btn:hover{color:var(--primary)}
.cfiles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cfile{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:30px;padding:0 4px 0 8px;border:1px solid var(--divider);border-radius:8px;background:var(--bg);font-size:12.5px}
.cfile svg.i{width:16px;height:16px;color:var(--primary)}
.cfile span{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfile small{color:var(--text2)}
.cfile button{border:0;background:none;cursor:pointer;color:var(--text2);display:grid;place-items:center;padding:2px;border-radius:50%}
.cfile button:hover{background:var(--hover);color:var(--error)}
.cfile button svg.i{width:14px;height:14px;color:inherit}
.cfile img{width:22px;height:22px;border-radius:4px;object-fit:cover}
.ufiles{display:grid;gap:6px;justify-items:end;margin-top:6px}
.ufiles:first-child{margin-top:0}
.ufiles img{max-width:180px;max-height:140px;border-radius:8px;display:block;border:1px solid rgba(255,255,255,.35)}
.ufile{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.18);font-size:12.5px;max-width:220px}
.ufile svg.i{width:15px;height:15px}
.ufile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat.drag{outline:2px dashed var(--primary);outline-offset:-6px}
.drop-hint{display:none;position:absolute;inset:0;z-index:5;background:var(--primary-a08);place-items:center;font-weight:600;color:var(--primary);pointer-events:none}
.chat{position:relative}
.chat.drag .drop-hint{display:grid}
.tip-l{margin-top:10px;font-size:12.5px;color:var(--text2)}
.cbox{padding:10px 14px 12px;border-top:1px solid var(--divider);flex:none}
.chat .composer{align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;max-height:120px;height:42px;padding:10px 14px;border:1px solid var(--in-border);border-radius:12px;background:transparent;font-size:15px;line-height:1.45;outline:none;font-family:inherit;color:var(--text)}
.composer textarea:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.chat .composer .btn{width:42px;height:42px;border-radius:12px}
.chat .composer .btn[disabled]{background:var(--hover);color:var(--text2);box-shadow:none}
.chint{font-size:11px;color:var(--text2);margin-top:6px}
.typing-l{font-size:11.5px;color:var(--text2);margin-top:4px}
/* Split view: chat open = left workspace (70%) + right chat (30%) */
.container.split{max-width:1560px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(420px,1fr);gap:32px;align-items:stretch}
.split-main{min-width:0}
.split table{min-width:640px}
.split-side{position:relative;min-width:0;animation:slideIn .22s ease-out}
/* chat sticks while scrolling but never runs past the bottom of My Tickets */
.split-side .chat{position:sticky;top:16px;height:min(calc(100vh - 130px), 100%);min-height:min(460px, 100%)}
@keyframes slideIn{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}

/* SelfServiceFields.jsx */
.ff-label{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;min-height:30px}
.ff-label .req{color:var(--error);margin-left:6.4px}

.tip:hover .tip-box,.tip:focus .tip-box{opacity:1}
.ss-input{width:100%;border:1px solid var(--in-border);border-radius:8px;background:transparent;font-size:16px;padding:16.5px 14px;outline:none;transition:border-color .15s;line-height:1.4375}
.ss-input:hover{border-color:var(--in-hover)}
.ss-input:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
textarea.ss-input{resize:none;height:calc(6 * 23px + 33px)}

.ss-input.err{border-color:var(--error)}
.ss-input[readonly]{background:var(--ro-bg);border-color:var(--ro-border);cursor:not-allowed;box-shadow:none}
.helper{color:var(--error);font-size:12px;margin:3px 14px 0;letter-spacing:.03333em}
.drop{border:2px dashed var(--grey400);border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:.1s;display:grid;justify-items:center;gap:8px;font-size:14px}
.drop:hover,.drop.over{border-color:var(--primary)}
.drop.over{background:var(--hover)}
.drop svg.i{width:40px;height:40px;color:var(--primary)}

.files-cap{font-size:12px;color:var(--text2);font-weight:600;margin-top:16px;display:block}
.files{display:grid;gap:8px;margin-top:8px;max-height:200px;overflow-y:auto;padding-right:8px}

.form-actions{display:grid;grid-template-columns:5fr 1fr;gap:16px}

/* Ticket details (UpdateIncidentSelfService.jsx) */
.detail-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:16px;display:grid;gap:16px}
.pg-title{font-size:24px;font-weight:800;line-height:1.334}
.kv-line{font-size:14px;color:var(--text2);margin-top:4px}
.kv-line b{color:var(--text)}

.cmt-h b{font-size:14px;font-weight:600}

.cmt-scroll{max-height:340px;overflow-y:auto;padding-right:8px}

/* Ticket details v3: one simple card */
.td-wrap{max-width:860px;margin:0 auto}

.mini-steps li.cur{border-color:var(--primary);color:var(--primary)}
.mini-steps li.wait{border-color:var(--warning);color:var(--warn-ink)}

.td-facts dd{margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.td-sec{padding:4px 28px 20px}
.td-sec h2{font-size:14px;font-weight:700;margin-bottom:8px}
.mtk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 16px;flex-wrap:wrap}.mtk-head h1{margin:0 0 4px;font-size:24px}.mtk-head p{margin:0}.mtk-empty{text-align:center;margin-top:12px}

/* Guess category / priority from the user's own words */
function classify(type, text){
  const t = text.toLowerCase();
  const cat = /wi-?fi|vpn|internet|network|lan\b/.test(t) ? 'Network'
    : /password|login|log in|locked|account/.test(t) ? 'Account'
    : /access|folder|drive|permission/.test(t) ? 'Access'
    : /printer|print|monitor|laptop|mouse|keyboard|screen|hardware|headset/.test(t) ? 'Hardware'
    : /outlook|email|mail|software|install|app|excel|teams|zoom|adobe/.test(t) ? 'Software' : 'General';
  const pri = /urgent|asap|cannot work|can'?t work|all users|everyone|down\b|outage/.test(t) ? 'High' : type === 'issue' ? 'Medium' : 'Low';
  let subject = text.replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s/)[0];
  if (subject.length > 80) subject = subject.slice(0,77).trim() + '…';
  subject = subject.charAt(0).toUpperCase() + subject.slice(1);
  return { type, subject, desc:text.trim(), category:cat, priority:pri };
}
function kbMatch(t){
  t = t.toLowerCase();
  return /receipt|pos printer|printer.*offline|offline.*printer/.test(t) && !/jam/.test(t) ? 9 : /password|locked/.test(t) ? 1 : /wi-?fi|internet/.test(t) ? 2 : /outlook|email/.test(t) ? 3 : /printer|jam/.test(t) ? 4 : /install|software/.test(t) ? 5 : /folder|shared drive|access/.test(t) ? 6 : /vpn/.test(t) ? 7 : 0;
}

    <div class="dl"><span>Subject</span><b>${esc(d.subject)}</b><span>Category</span><b>${d.category}</b><span>Priority</span><b>${d.priority}</b>${d.details ? `<span>Details</span><b>${esc(d.details)}</b>` : ''}${d.files?.length ? `<span>Attachments</span><b>${d.files.map(f => esc(f.name)).join(', ')}</b>` : ''}</div>${state_}</div>
    ${m.tip && !m.cancelled ? `<div class="tip-l">While you wait, this might help:</div>${kbcard(m.tip)}` : ''}`;
}
function logDraft(i){
  const m = state.chat[i]; if (!m || m.done || m.cancelled) return;
  const d = m.draft, no = nextNo(d.type === 'issue' ? 'INC' : 'REQ'), ts = stamp();
  state.tickets.unshift({ no, type:d.type, subject:d.subject, desc:d.desc + '\n\n(Logged through Becky chat)', createdFrom:'Becky', caller:me().name, status:'New', created:ts, resolved:'', priority:d.priority, category:d.category, sub:'', solution:'', attachments:(d.files || []).map(f => ({ name:f.name, up:ts })), comments:[] });
  amaAssign(state.tickets[0]);
  m.done = no; state.chatMode = null; state.lastIssue = null;
  state.chat.push({ from:'bot', t:tnow(), html:`<p>Done! I’ve logged <b>${no}</b> for you. The Service Desk will pick it up soon, and you can follow it in <b>My Tickets</b>.</p>${tcard(state.tickets[0], false)}`, sugg:['Report another issue','Request something','Check my tickets'] });
  state.dtPage = 0;
  render();
  snackbar('success', `${d.type === 'issue' ? 'Incident' : 'Request'} <b>${no}</b> logged`);
}

function answer(q){
  const t = q.toLowerCase().trim();
  if (state.chatMode === 'desc' && state.pendIssue && !/^(report (an |another )?issue|request something|check my tickets)$/.test(t)){
    const p = state.pendIssue, skip = /^(skip|no|nope|tak|takde|nothing|log it)/.test(t) && t.length < 30;
    const r = draftAnswer('issue', skip ? p.text : p.text + '\n\n' + q.trim(), skip ? 'No problem. Here’s what I’ll log for you:' : 'Thanks, that helps. Here’s what I’ll log for you:');
    r.draft.subject = classify('issue', p.text).subject; if (!skip) r.draft.details = q.trim();
    return r;
  }
  if (/^(generate|create|build|make) (a |my )?((report )?dashboard|report)\b/.test(t)){
    if (!agAllowed()) return { html:`<p>Generating dashboards is only available to Support and Manager users. I can help you report an issue, request something or check your tickets.</p>`, sugg:FLOWS.map(f => f.q) };
    return { html:`<p>Sure. Pick a starting point and I’ll open <b>Generate Report</b> with it. You can change every choice there.</p><div class="tgrid ag-tg" style="margin-left:0">${AG_TOPICS.map(([k, l, i]) => `<button class="topic" data-aigen-open="${k}"><span class="ti">${ic(i)}</span>${l}</button>`).join('')}</div><button class="btn btn-outlined btn-sm cta" data-aigen-open>${ic('openNew')}Open Generate Report</button>` };
  }
  if (/^report (an |another )?issue/.test(t)) return { mode:'issue', html:`<p>Sure. What’s going wrong? Describe it in your own words, for example <i>“My laptop can’t connect to Wi-Fi since this morning”</i>.</p>` };
  if (/^(request (something|another)|make a request|new request)/.test(t)) return { mode:'request', html:`<p>Happy to help. What do you need? Tell me in your own words, or pick one below.</p>`, sugg:['Install new software','Access to a shared folder','A new monitor or accessory'] };
  const tm = t.match(/(inc|req)\d{5}/);
  if (tm){
    const tk = state.tickets.find(x => x.no.toLowerCase() === tm[0]);
    if (tk) return { html:`<p>Here's the latest on <b>${tk.no}</b>:</p>${tcard(tk, true)}${tk.status === 'Pending' ? '<p style="margin-top:8px">This ticket is waiting for your reply.</p>' : ''}`, sugg:['Check my tickets','Report an issue'] };
    return { html:`<p>I couldn't find <b>${esc(tm[0].toUpperCase())}</b> under your account. Check the number in the <b>My Tickets</b> list.</p>`, sugg:['Check my tickets'] };
  }
  if (/check my ticket|open ticket|my ticket|ticket status|status of my/.test(t)){
    const o = openTickets();
    return { html: o.length ? `<p>You have <b>${o.length}</b> open ticket${o.length === 1 ? '' : 's'}:</p>${o.map(x => tcard(x, false)).join('')}` : `<p>You don't have any open tickets right now. 🎉</p>`, sugg:['Report an issue','Request something'] };
  }
  if (state.chatMode === 'issue') return askDesc(q, 'Thanks, I’ve noted that.');
  if (state.chatMode === 'request') return draftAnswer(state.chatMode, q);
  if (/still not|not work|didn'?t (help|work)|doesn'?t work|log (this|it)|raise|create (a )?ticket|new ticket/.test(t))
    return state.lastIssue ? askDesc(state.lastIssue, 'Sorry that didn’t fix it. I’ll log it for the Service Desk.') : askDesc(q);
  if (/^(hi|hello|hey|salam|assalam)/.test(t)) return { html:`<p>Hello! What can I help you with today?</p>`, sugg:FLOWS.map(f => f.q) };
  if (/thank|terima kasih|tq\b/.test(t)) return { html:`<p>You're welcome! Anything else I can help with?</p>`, sugg:FLOWS.map(f => f.q) };
  if (/^(install|access to|a new|i need|can i get|i want|request)/.test(t)) return draftAnswer('request', q);
  const kbA = (html, id) => ({ html: html + kbcard(id), sugg:['Log this as an issue','That fixed it, thanks'], issue:true });
  if (/password|locked|lock out/.test(t)) return kbA(`<p>You can reset it yourself in about 2 minutes:</p><ol><li>Open the Password Self-Service portal.</li><li>Enter your staff ID and verify with the SMS code.</li><li>Set a new password (min. 12 characters).</li></ol>`, 1);
  if (/wi-?fi|wifi|network|internet/.test(t)) return kbA(`<p>Try these first:</p><ol><li>Forget <b>CORP-WIFI</b> and connect again.</li><li>Check airplane mode is off.</li><li>Restart the laptop while plugged into power.</li></ol><p>You already have <b>INC06018</b> open for this, and an engineer is on it.</p>`, 2);
  if (/vpn|home|remote/.test(t)) return kbA(`<p>Use <b>FortiClient VPN</b>:</p><ol><li>Choose the <i>Corporate-VPN</i> profile.</li><li>Sign in with your network login.</li><li>Approve the push on the Authenticator app.</li></ol>`, 7);
  if (/receipt|pos printer|printer.*offline|offline.*printer|cannot print receipt/.test(t) && !/jam/.test(t)) return kbA(`<p>This is a <b>known issue</b> after the Windows update. IT is already working on a permanent fix, so you don’t need to log a ticket. Try this (about 2 minutes):</p><ol><li>Open <b>Settings › Printers</b> and remove <b>POS-Receipt</b>.</li><li>Unplug and replug the USB cable.</li><li>Click <b>Add printer</b>, choose <b>POS-Receipt (USB)</b>, then print a test receipt.</li></ol>`, 9);
  if (/printer|print|jam/.test(t)) return kbA(`<p>Turn the printer off, open the front door, remove the toner and pull the paper out slowly. Fan the paper before reloading.</p>`, 4);
  if (/outlook|email|mail/.test(t)) return kbA(`<p>Remove saved <i>MicrosoftOffice</i> entries in <b>Credential Manager</b>, then sign in to Outlook again.</p>`, 3);
  return askDesc(q, 'I don’t have a quick fix for that, but I can log it for the Service Desk.');
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); let h=d.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(h)}:${p(d.getMinutes())} ${ap}`; }
function nextNo(prefix = 'INC'){ const nums = state.tickets.filter(t => t.no.startsWith(prefix)).map(t => +t.no.slice(prefix.length)); return prefix + String((nums.length ? Math.max(...nums) : 1240) + 1).padStart(5,'0'); }
function go(view, extra={}){ Object.assign(state, {view, drawer:false, chatPop:false}, extra); render(); window.scrollTo({top:0}); }

let snackTimer;
function snackbar(severity, message){

  clearTimeout(snackTimer); snackTimer = setTimeout(() => { $('#snack').innerHTML = ''; }, 6000);

const kbAudLabel = (a) => a.supOnly ? 'Support only' : !a.wgs.length ? 'Everyone' : a.wgs.length === 1 ? a.wgs[0] : `${a.wgs[0]} +${a.wgs.length - 1}`;
function kbWgInit(k){
  if (!Array.isArray(k.wgs)){ const a = k.audience || 'All staff'; k.supOnly = a === 'Support only'; k.wgs = (KB_OLD_AUD[a] || []).slice(); }

const KB_AUDIENCES_F = () => ['Everyone', ...WORKGROUPS.map(w => w.n).filter(n => state.kb.some(k => k.wgs.includes(n))), 'Support only'];
const kbAudMatch = (x, a) => a === 'Everyone' ? !x.supOnly && !x.wgs.length : a === 'Support only' ? !!x.supOnly : x.wgs.includes(a);

  ticks.forEach(v => { s += `<line x1="${L}" x2="${W - RP}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grey300)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${tfmt(v)}</text>`; });
  labels.forEach((lb, i) => {
    const cx = L + i * cw + cw / 2, x0 = cx - (bw * n + 3 * (n - 1)) / 2;
    series.forEach((vals, j) => {
      const c = typeof colors[j] === 'function' ? colors[j](vals[i]) : colors[j];
      s += `<rect x="${x0 + j * (bw + 3)}" y="${y(vals[i])}" width="${bw}" height="${Math.max(0, y(lo) - y(vals[i]))}" rx="3" fill="${c}"><title>${esc(lb)}: ${fmt(vals[i])}</title></rect>`;
      if (opt.values) s += `<text x="${x0 + j * (bw + 3) + bw / 2}" y="${y(vals[i]) - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmt(vals[i])}</text>`;
    });
    if (!opt.every || i % opt.every === 0) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  if (opt.target !== undefined) s += `<line x1="${L}" x2="${W - RP}" y1="${y(opt.target)}" y2="${y(opt.target)}" stroke="var(--error)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return s + '</svg>';
}

function dbDonut(segs, total, sub, size = 150){

  return `<svg class="db-donut" viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="${esc(sub)}"><circle cx="${S / 2}" cy="${S / 2}" r="${r}" fill="none" stroke="var(--primary-a08)" stroke-width="22"/>${arcs}
    <text x="50%" y="47%" text-anchor="middle" class="db-dt">${total}</text><text x="50%" y="61%" text-anchor="middle" class="db-ds">${esc(sub)}</text></svg>`;

/* ---------- slice the data for one period ---------- */

  const created = T.filter(t => inR(t.c, s, e)), resolved = T.filter(t => t.res && inR(t.res, s, e));
  const openAt = (X) => T.filter(t => t.c < X && (!t.res || t.res >= X));

function deltaTxt(cur, prev, unit = '%', lowerBetter = false){

  if (unit === '%'){ if (!prev) return 'No earlier data to compare'; const p = Math.round(diff / prev * 100); return `${p > 0 ? '+' : ''}${p}% vs previous period`; }
  if (Math.abs(diff) < 0.05) return 'Same as previous period';
  const better = lowerBetter ? diff < 0 : diff > 0;

}

/* Line chart, one scale. series: [{ name, vals (null = no data), color }] */
function lines(labels, series, ticks, opt = {}){
  /* Smooth line chart (Region report): legend on top, axis lines with tick marks, hollow markers */
  const W = opt.W || 1150, H = opt.H || 270, L = 48, RP = 20, B = 30, T = opt.noLegend ? 14 : 38, tf = opt.tfmt || (v => v + '%'), vf = opt.fmt || (v => f1(v) + '%'), lo = ticks[0], hi = ticks[ticks.length - 1], n = labels.length;
  const x = i => n === 1 ? (L + W - RP) / 2 : L + i * (W - L - RP) / (n - 1), y = v => T + (H - T - B) * (1 - (Math.max(lo, v) - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'chart')}">`;
  /* legend, centred above the plot */
  const lw = series.map(sr => 34 + sr.name.length * 7.4), tw = lw.reduce((a, b) => a + b, 0) + 18 * (series.length - 1);
  let lx = (W - tw) / 2;
  if (!opt.noLegend) series.forEach((sr, i) => { s += `<line x1="${lx}" x2="${lx + 16}" y1="18" y2="18" stroke="${sr.color}" stroke-width="4" stroke-linecap="round"/><text x="${lx + 24}" y="22" style="fill:var(--text);font-size:13px">${esc(sr.name)}</text>`; lx += lw[i] + 18; });
  /* axes */
  s += `<line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="var(--text2)" stroke-width="1"/><line x1="${L}" x2="${W - RP}" y1="${H - B}" y2="${H - B}" stroke="var(--text2)" stroke-width="1"/>`;
  ticks.forEach(v => { s += `<line x1="${L - 5}" x2="${L}" y1="${y(v)}" y2="${y(v)}" stroke="var(--text2)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${tf(v)}</text>`; });
  labels.forEach((lb, i) => { s += `<line x1="${x(i)}" x2="${x(i)}" y1="${H - B}" y2="${H - B + 5}" stroke="var(--text2)"/>`; if (!opt.every || i % opt.every === 0 || i === n - 1) s += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(lb)}</text>`; });
  /* monotone cubic curve through each run of points (no overshoot above 100%) */
  const curve = (P) => { if (P.length < 2) return ''; const m = P.length, d = [], t = [];
    for (let i = 0; i < m - 1; i++) d.push((P[i + 1][1] - P[i][1]) / (P[i + 1][0] - P[i][0]));
    for (let i = 0; i < m; i++) t.push(i === 0 ? d[0] : i === m - 1 ? d[m - 2] : d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
    for (let i = 0; i < m - 1; i++){ if (d[i] === 0){ t[i] = t[i + 1] = 0; continue; } const a = t[i] / d[i], b = t[i + 1] / d[i], h = a * a + b * b; if (h > 9){ const k = 3 / Math.sqrt(h); t[i] = k * a * d[i]; t[i + 1] = k * b * d[i]; } }
    let p = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
    for (let i = 0; i < m - 1; i++){ const dx = (P[i + 1][0] - P[i][0]) / 3; p += ` C${(P[i][0] + dx).toFixed(1)} ${(P[i][1] + t[i] * dx).toFixed(1)} ${(P[i + 1][0] - dx).toFixed(1)} ${(P[i + 1][1] - t[i + 1] * dx).toFixed(1)} ${P[i + 1][0].toFixed(1)} ${P[i + 1][1].toFixed(1)}`; }
    return p; };
  series.forEach(sr => {
    const runs = [[]]; sr.vals.forEach((v, i) => { if (v === null){ if (runs[runs.length - 1].length) runs.push([]); } else runs[runs.length - 1].push([x(i), y(v)]); });
    runs.forEach(r => { const d = curve(r); if (d) s += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linecap="round"/>`; });
    sr.vals.forEach((v, i) => { if (v === null) return;
      s += `<g class="rg-pt"><circle cx="${x(i)}" cy="${y(v)}" r="11" fill="transparent"/><circle cx="${x(i)}" cy="${y(v)}" r="5" fill="var(--paper)" stroke="${sr.color}" stroke-width="2"/><title>${esc(sr.name)} · ${esc(labels[i])}: ${vf(v)}</title></g>`; });
  });
  return s + '</svg>';
}

  if (step === 'title') return `${head}<div class="gp-hint">${ic('arrowFwd')}Type the title below, for example “${esc(agName(p))}”.</div>`;
  const opts = agOpts(step, p).filter(o => !(o[0] === '!save' && G.saved));
  const on = (v) => step === 'meas' ? p.meas.includes(v) : G.edit && (step === 'fval' ? (G.prevF || [])[1] === v : step === 'fby' ? (G.prevF || [])[0] === v : p[step] === v);
  const go_ = step === 'meas' ? `<button class="btn btn-contained btn-sm gp-go" data-ag-pick="!go" ${p.meas.length ? '' : 'disabled'}>Continue${p.meas.length ? ` (${p.meas.length})` : ''}</button>` : '';

}
function agDash(d, G){
  const B = agToB(d), [s0, e0] = periodRange(B.period), s = Math.max(s0, R_START), e = Math.min(e0, R_TODAY);
  const { rows, total } = mbRows(B, s, e), len = nDays(s, e), ps = addDays(s, -len), P = ps >= R_START ? mbRows(B, ps, addDays(s, -1)).total : null;
  const ICON = { logged:'ticket', resolved:'okCircle', sla:'schedule', res:'build', fcr:'headset', csat:'up' };
  const unit = (k) => MB_MEAS.find(m => m[0] === k)[2];
  const dT = (k) => { if (!P || P[k] === null || total[k] === null) return 'No earlier data to compare'; const u = unit(k); return u === 'n' ? deltaTxt(total[k], P[k]) : u === 'h' ? deltaTxt(total[k], P[k], 'h', true) : deltaTxt(total[k], P[k], ' pts'); };
  const kp = d.meas.slice(0, 4);
  const kpis = `<div class="stats ag-k" style="--n:${kp.length}">${kp.map(k => stat(ICON[k], agMeasL(k), mbFmt(k, total[k]), dT(k), k === 'sla' && total.sla !== null && total.sla < 95)).join('')}</div>`;
  /* Becky summary: totals, then the highest and lowest group for the first measure */
  const cm = d.meas[0], vals = rows.filter(r => r[cm] !== null && (unit(cm) !== 'n' || r[cm] > 0));
  const hi = vals.slice().sort((a, b) => b[cm] - a[cm])[0], lo = vals.slice().sort((a, b) => a[cm] - b[cm])[0];
  let ins = `${d.meas.slice(0, 3).map(k => `${esc(agMeasL(k))} <b>${mbFmt(k, total[k])}</b>`).join(' · ')}.`;
  if (hi && lo && hi !== lo) ins += ` Highest ${esc(agMeasL(cm))}: <b>${esc(hi.label)}</b> (${mbFmt(cm, hi[cm])}). Lowest: <b>${esc(lo.label)}</b> (${mbFmt(cm, lo[cm])}).`;
  if (d.meas.includes('sla') && total.sla !== null) ins += total.sla < 95 ? ' SLA met is <b>below</b> the 95% target.' : ' SLA met is at or above the 95% target.';
  if (!total.logged && !total.resolved) ins = 'No tickets match these choices in this period.';
  const chips = [['Measures', d.meas.map(agMeasL).join(', ')], ['Group by', agGroupL(d.group)], ['Period', agLabel('period', d.period, d)], d.fby === 'none' ? ['Filter', 'All tickets'] : [{ cat:'Category', pri:'Priority', ag:'Agent' }[d.fby], d.fval], ['Show as', agLabel('style', d.style, d)]];
  const saveBtn = G && G.saved ? `<span class="spill ok ag-saved">${ic('okCircle')}Saved</span><button class="btn btn-outlined btn-sm" data-ag-openb>${ic('openNew')}Open in Report builder</button>`
    : `<button class="btn btn-contained btn-sm" data-ag-pick="!save">${ic('save')}Save report</button>`;
  return `<div class="cc"><div class="cc-body ag-head">
      <span class="ti big">${ic('assessment')}</span>
      <div style="flex:1;min-width:0"><div class="pg-title" style="font-size:20px">${esc(agTitle(d))}</div>
        <div class="pg-sub">${rangeLabel(s, e)} (${daysLabel(s, e)}) · Generated ${d.at} by Becky for ${esc(me().name)}</div>
        <div class="chips">${chips.map(([k, v]) => `<span class="chip" style="padding-right:10px">${k}: ${esc(v)}</span>`).join('')}</div></div>
      <div class="pg-act">${saveBtn}<button class="btn btn-outlined btn-sm" data-demo="Export to Excel is not part of this mockup.">${ic('upload')}Excel</button><button class="btn btn-outlined btn-sm" data-demo="Export to PDF is not part of this mockup.">${ic('pdf')}PDF</button></div>
    </div></div>
    <div class="ag-ins"><span class="ti">${beckyAv()}</span><div><b>Becky summary</b><div>${ins}</div></div></div>
    ${kpis}
    ${mbPreview(B, s, e, true)}
    <p class="muted" style="font-size:12px;text-align:center">Sample data for this mockup. ${P ? `Changes compare against the previous ${daysLabel(s, e)}.` : 'There is no earlier data of the same length to compare against.'}</p>`;
}

function amDoStatus(){

  if (!off && D.to === 'In Use'){ set('holder', 'Holder', D.holder); set('loc', 'Location detail', D.loc.trim()); set('ins', 'In-service date', D.ins); }
  if (!off && D.to === 'In Store'){ set('holder', 'Holder', ''); set('loc', 'Location detail', D.loc.trim()); }
  if (!off && D.to === 'Disposed'){ set('holder', 'Holder', ''); set('dDate', 'Disposal date', D.dDate); set('dMethod', 'Disposal method', D.dMethod); }
  amLog(a, ch, D.why.trim());

  if (k === 'war') rows = byDate(a => a.war);
  else if (k === 'eos') rows = byDate(amEosOf);
  else if (k === 'eol'){ rows = []; note = 'No model has an end-of-life date in the sample data.'; }
  else if (k === 'ul') rows = byDate(a => { const d = amD(a.ins); if (!d) return ''; const e = new Date(d.getFullYear() + 4, d.getMonth(), d.getDate()), p = x => String(x).padStart(2, '0'); return `${p(e.getDate())}/${p(e.getMonth() + 1)}/${e.getFullYear()}`; });
  else if (k === 'lexp'){ unit = 'licence'; cols = ['Software','Expiry','Days left']; rows = state.licences.filter(l => within(l.exp)).map(l => [l.name, l.exp, String(amDays(l.exp))]); }

/* Device type from the model, so the user sees a friendly name and icon */
const mdType = (a) => a.kind === 'Virtual' ? ['Virtual machine', 'mdServer'] : /latitude|thinkpad|elitebook|laptop/i.test(a.model) ? ['Laptop', 'mdLaptop']
  : /laserjet|printer/i.test(a.model) ? ['Printer', 'mdPrint'] : /monitor/i.test(a.model) ? ['Monitor', 'kbMonitor'] : /catalyst|switch/i.test(a.model) ? ['Network switch', 'mdServer'] : ['Device', 'kbMonitor'];
function mdMine(){
  const who = me().name, mine = state.assets.filter(a => a.holder === who && a.status !== 'Disposed'), tags = mine.map(a => a.tag);
  const lics = state.licences.filter(l => l.basis === 'Per user' ? l.held.includes(who) : l.basis === 'Per device' && l.held.some(t => tags.includes(t)))
    .map(l => ({ l, how:l.basis === 'Per user' ? ['Personal', 'Licensed to you'] : ['Device', 'On ' + l.held.filter(t => tags.includes(t)).join(', ')] }));
  return { mine, lics };
}
function vMyDevices(){

  const tbl = (cols, rows, empty, w) => tblHtml(cols, rows, w).replace('No data for this period', empty);
  const who = (icon, b, sm) => `<span class="md-who"><span class="ti">${ic(icon)}</span><span class="g"><b>${b}</b><small>${sm}</small></span></span>`;
  const head = (t, n, sub) => `<div style="min-width:0"><h2>${t} <span class="md-n">${n}</span></h2><div class="muted" style="font-size:12.5px">${sub}</div></div>`;

      <div class="cc md-stat"><span class="ti">${ic('mdApps')}</span><div><b>${lics.length}</b><span>Software licence${lics.length === 1 ? '' : 's'}</span></div></div>
    </div>
    <div class="cc"><div class="cc-head sm">${head('My devices', mine.length, 'Use Report issue if a device is faulty, so the Service Desk knows which one.')}</div><div class="cc-body">
      ${tbl([{ h:'No.', w:56 }, { h:'Device' }, { h:'Asset Tag', w:120 }, { h:'Serial No. / Hostname', w:190 }, { h:'Branch', w:160 }, { h:'Action', w:170 }],
        mine.map((a, i) => { const [t, icn] = mdType(a); return [i + 1, who(icn, esc(a.model || a.host), t), `<b>${esc(a.tag)}</b>`, esc(amId(a)), esc(a.branch || '-'),
          `<button class="btn btn-outlined btn-sm" data-md-report="${esc(a.tag)}">${ic('build')}Report issue</button>`]; }), 'No devices are given to you yet.', 900)}
    </div></div>
    <div class="cc"><div class="cc-head sm">${head('My software licences', lics.length, 'Software you are licensed to use, for you or on your device.')}</div><div class="cc-body">
      ${tbl([{ h:'No.', w:56 }, { h:'Software' }, { h:'Licence', w:220 }],

/* Report issue: open Submit Ticket with the device already filled in */

  const k = el.dataset.mdReport, a = amById(k);

/* ============ Render ============ */
function render(){
  const views = { home:vHome, new:vNew, detail:vDetail, kb:vKb, article:vArticle, support:vSDash, sdash:vSDash, stickets:vSTickets, sdetail:vSDetail, problems:vProblems, pdetail:vPDetail, pnew:vPNew, tnew:vTNew, reports:vReports, rview:vRView, mdash:vMDash, mtickets:vMTickets, mbuild:vMRBuilder, aigen:vAiGen, mlview:vMLView, assets:vAssets, asset:vAsset, assetnew:vAssetNew, licence:vLicence, mydevices:vMyDevices };
  $('#app').innerHTML = state.view === 'login' ? vLogin() : shell(views[state.view]()) + floatChat();
  $('#app').classList.toggle('pop-open', state.chatPop && (state.role === 'support' || state.role === 'manager' || CHAT_PAGES.includes(state.view)));
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  if (state.view === 'new') renderFiles();
  if (state.view === 'detail'){ const l = $('.uc-list'); if (l) l.scrollTop = l.scrollHeight; }
}
function renderChat(){ const c = $('#chat'); if (!c) return; const inp = $('#chatInput'); const v = inp ? inp.value : ''; const f = document.activeElement === inp; c.outerHTML = vChat(); const n = $('#chatInput'); n.value = v; autosize(n); updSend(); if (f) n.focus({preventScroll:true}); const m = $('#msgs'); m.scrollTop = m.scrollHeight; }
function rerenderKeepFocus(id){ const el = $('#'+id); const pos = el ? el.selectionStart : 0; render(); const n = $('#'+id); if (n){ n.focus(); n.setSelectionRange(pos,pos); } }
function setDrawer(open){ state.drawer = open; $('.drawer')?.classList.toggle('open', open); $('.backdrop')?.classList.toggle('open', open); if (open) setTimeout(() => $('#navSearch')?.focus(), 230); }
function closePops(except){ $$('.pop.open').forEach(p => { if (p.id !== except) p.classList.remove('open'); }); }

function ask(q){
  q = (q || '').trim();
  if (state.chatBusy || (!q && !state.chatFiles.length)) return;
  const files = state.chatFiles.splice(0);
  let reply;
  if (!q){
    const pend = [...state.chat].reverse().find(m => m.draft && !m.done && !m.cancelled);
    const n = files.length, what = n === 1 ? 'the file' : `${n} files`;
    if (pend){ pend.draft.files = [...(pend.draft.files || []), ...files]; reply = { html:`<p>Added ${what} to your ${pend.draft.type === 'issue' ? 'incident' : 'request'}. Click <b>Log it</b> when you’re ready.</p>` }; }
    else { state.carryFiles.push(...files); reply = state.chatMode === 'desc' ? { mode:'desc', html:`<p>Got ${what}. Add any details you want, or skip and I’ll log it.</p>`, sugg:['Skip, log it now'] } : state.chatMode ? { mode:state.chatMode, html:`<p>Got ${what}. Now tell me in your own words what ${state.chatMode === 'issue' ? 'is going wrong' : 'you need'}.</p>` } : { html:`<p>Thanks, I’ve got ${what}. What would you like me to do?</p>`, sugg:['Report an issue','Request something'] }; }
  } else if (/that fixed it/i.test(q)){
    state.lastIssue = null; state.carryFiles = [];
    reply = { html:'<p>Great, glad that worked! 🙌 Anything else?</p>', sugg:FLOWS.map(f => f.q) };
  } else {
    reply = answer(q);
    if (reply.issue) state.lastIssue = q;
    if (reply.draft){ reply.draft.files = [...state.carryFiles, ...files]; state.carryFiles = []; }
    else if (files.length) state.carryFiles.push(...files);
  }
  state.chatMode = reply.mode || null;
  if (reply.pend) state.pendIssue = reply.pend; else if (state.chatMode !== 'desc') state.pendIssue = null;
  state.chat.push({from:'user', raw:q, files, t:tnow()}, {typing:true}); state.chatBusy = true; renderChat();
  setTimeout(() => { state.chat.pop(); state.chat.push({from:'bot', html:reply.html, sugg:reply.sugg, draft:reply.draft, tip:reply.tip, t:tnow()}); state.chatBusy = false; renderChat(); }, 650 + Math.min(700, reply.html.length));
}

const homeFor = () => state.role === 'support' ? 'sdash' : state.role === 'manager' ? 'mdash' : 'home';

function goMyTickets(){ go('home'); setTimeout(() => $('#mytickets')?.scrollIntoView({behavior:'smooth', block:'start'}), 30); }

/* ============ Events ============ */
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('.pop-wrap')) closePops();
  const el = t.closest('[data-go],[data-ticket],[data-kb],[data-cat],[data-prompt],[data-rm],[data-helpful],[data-drawer],[data-nav],[data-pop],[data-demo],[data-reveal],[data-ms],[data-theme-toggle],[data-snack-close],[data-dt-filter],[data-dt-clear],[data-dt-reset],[data-page],[data-ts-clear],[data-kb-clear],[data-chat-min],[data-chat-open],[data-role],[data-chat-new],[data-chat-ticket],[data-draft],[data-chat-attach],[data-cfile-rm],[data-ask-ticket]');
  if (!el) return;
  const d = el.dataset;
  const fromChat = !!el.closest('#chat') && state.view !== 'home';
  if ('chatMin' in d || 'chatOpen' in d){
    const open = 'chatOpen' in d;
    if (state.view === 'home') state.chatMin = !open; else state.chatPop = open;
    render();
    if (!state.chatMin){ $('#chatInput')?.focus({preventScroll:true}); }
    else $('.chat-fab')?.focus();
    return;
  }
  if (d.role){ if (d.role !== state.role){ closePops(); state.role = d.role; go(homeFor(), {chatMin:false, chat:[], lastIssue:null, chatMode:null, chatFiles:[], carryFiles:[]}); } return; }
  if (d.askTicket){ state.chatPop = true; render(); ask(`What is the status of ${d.askTicket}?`); $('#chatInput')?.focus({preventScroll:true}); return; }
  if ('chatAttach' in d){ $('#chatFile')?.click(); return; }
  if (d.cfileRm){ state.chatFiles.splice(+d.cfileRm, 1); renderChat(); return; }
  if (d.draft){ const i = +d.i, m = state.chat[i]; if (!m || m.done || m.cancelled || state.chatBusy) return;
    if (d.draft === 'log') logDraft(i);
    else { m.cancelled = true; const edit = d.draft === 'edit'; state.chatMode = edit ? m.draft.type : null;
      state.chat.push({from:'bot', t:tnow(), html: edit ? '<p>No problem. Tell me again in your own words, and add anything I missed.</p>' : '<p>Okay, I won’t log it. Anything else I can help with?</p>', sugg: edit ? [] : FLOWS.map(f => f.q)}); renderChat(); }
    return; }
  if ('chatNew' in d){ state.chat = []; state.lastIssue = null; state.chatMode = null; state.chatFiles = []; state.carryFiles = []; state.chatBusy = false; renderChat(); $('#chatInput')?.focus(); return; }
  if ('chatTicket' in d){ chatToTicket(); return; }
  if (d.fb){ const m = state.chat[+d.i]; if (m && !m.fb){ m.fb = d.fb; if (d.fb === 'down' && !state.chatBusy) state.chat.push({from:'bot', html:`<p>Sorry that didn't help. Want me to log it as an issue so the Service Desk can take a look?</p>`, sugg:['Log this as an issue','Report an issue'], t:tnow()}); renderChat(); } return; }
  if (d.go){ e.preventDefault(); if (d.go === 'mytickets') return goMyTickets(); if (d.go === 'new'){ state.files = []; state.draft = null; } go(d.go); }
  else if (d.ticket){ e.stopPropagation(); closePops(); go(state.role === 'support' && !(['mtickets','detail'].includes(state.view) && mineTickets().some(t => t.no === d.ticket)) ? 'sdetail' : 'detail', {ticketId:d.ticket, tsQuery:'', chatPop:fromChat}); }
  else if (d.kb){ go('article', {articleId:+d.kb, chatPop:fromChat}); }
  else if (d.cat){ state.kbCat = d.cat; render(); }
  else if (d.prompt){ ask(d.prompt); }
  else if (d.rm){ state.files.splice(+d.rm, 1); renderFiles(); }
  else if ('helpful' in d){ $('#helpful').innerHTML = `<span style="display:flex;gap:8px;align-items:center;color:var(--success)">${ic('okCircle')}<span style="color:var(--text)">Thanks for your feedback.</span></span>`; }
  else if (d.drawer){ setDrawer(d.drawer === 'open'); }
  else if (d.nav){ if (d.nav === 'mytickets') goMyTickets(); else { if (d.nav === 'new'){ state.files = []; state.draft = null; } go(d.nav); } }
  else if (d.pop){ const p = $('#pop-'+d.pop); closePops(p.id); p.classList.toggle('open'); }
  else if (d.demo){ closePops(); snackbar('error', d.demo); }
  else if ('reveal' in d){ state.showPass = !state.showPass; const i = $('#lg-pass'); i.type = state.showPass ? 'text' : 'password'; el.innerHTML = REVEAL(state.showPass); }
  else if ('ms' in d){ state.role = 'user'; go(homeFor(), {chatMin:false, chat:[], lastIssue:null, chatMode:null, chatFiles:[], carryFiles:[]}); }
  else if ('themeToggle' in d){ document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark'); const dk = isDark(); el.setAttribute('aria-checked', dk); el.querySelector('path').setAttribute('d', P[dk?'moon':'sun']); }
  else if ('snackClose' in d){ $('#snack').innerHTML = ''; }
  else if ('dtFilter' in d){ state.dtFilterOpen = !state.dtFilterOpen; render(); }
  else if ('dtClear' in d){ state.dtInput = ''; state.dtSearch = ''; state.dtPage = 0; render(); }
  else if ('dtReset' in d){ state.dtStatus = ''; state.dtPage = 0; render(); }
  else if (d.page){ const last = Math.max(0, Math.ceil(filteredTickets().length / state.dtRows) - 1); state.dtPage = {first:0, prev:Math.max(0,state.dtPage-1), next:Math.min(last,state.dtPage+1), last}[d.page]; render(); }
  else if ('tsClear' in d){ state.tsQuery = ''; rerenderKeepFocus('tsInput'); }
  else if ('kbClear' in d){ state.kbQuery = ''; rerenderKeepFocus('kbSearch'); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closePops(); if (state.drawer) setDrawer(false); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chatInput'){ e.preventDefault(); $('#chatForm').requestSubmit(); }
  if (e.key === 'Enter' && e.target.id === 'dtSearch'){ state.dtSearch = state.dtInput.trim(); state.dtPage = 0; rerenderKeepFocus('dtSearch'); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=link]')){ e.preventDefault(); e.target.click(); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'loginForm'){
    const b = $('#signInBtn'); b.disabled = true; b.textContent = 'Signing in...'; state.role = 'user';
    setTimeout(() => { go(homeFor(), {chatMin:false, chat:[], lastIssue:null, chatMode:null, chatFiles:[], carryFiles:[]}); }, 600);
  }
  if (id === 'chatForm'){ const i = $('#chatInput'); const v = i.value; i.value = ''; ask(v); }
  if (id === 'ticketForm'){
    const s = $('#subject').value.trim(), d = $('#desc').value.trim();
    $('#subject').classList.toggle('err', !s); $('#subjectErr').hidden = !!s;
    $('#desc').classList.toggle('err', !d); $('#descErr').hidden = !!d;
    if (!s || !d){ snackbar('error', !s ? 'Subject is required' : 'Description is required'); return; }
    const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = 'Submitting...';
    setTimeout(() => {
      const no = nextNo();
      state.tickets.unshift({ no, subject:s, desc:d, status:'New', created:stamp(), resolved:'', priority:'Medium', category:'General', sub:'', solution:'', createdFrom:'Self Service', caller:me().name,
        attachments: state.files.map(f => ({name:f.name, up:stamp()})), comments:[] });
      amaAssign(state.tickets[0]); /* same auto assign as Becky and manual tickets */
      state.files = []; state.draft = null; state.dtSearch = ''; state.dtInput = ''; state.dtStatus = ''; state.dtPage = 0;
      go(state.role !== 'user' ? 'mtickets' : homeFor());
      snackbar('success', `Ticket <b>${no}</b> created successfully`);
    }, 700);
  }
});

document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'tsInput'){ state.tsQuery = e.target.value; rerenderKeepFocus(id); }
  if (id === 'kbSearch'){ state.kbQuery = e.target.value; rerenderKeepFocus(id); }
  if (id === 'dtSearch'){ state.dtInput = e.target.value; }
  if (id === 'chatInput'){ autosize(e.target); updSend(); }
  if (id === 'subject' && e.target.value.trim()){ e.target.classList.remove('err'); $('#subjectErr').hidden = true; }
  if (id === 'desc' && e.target.value.trim()){ e.target.classList.remove('err'); $('#descErr').hidden = true; }
  if (id === 'navSearch'){
    const q = e.target.value.trim().toLowerCase(); let n = 0;
    $$('#navList .nav-item').forEach(b => { const hit = !q || b.dataset.label.includes(q); b.hidden = !hit; if (hit) n++; });

  }

document.addEventListener('change', e => {

['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { const c = e.target.closest?.('#chat'); if (c && e.dataTransfer?.types?.includes('Files')){ e.preventDefault(); c.classList.add('drag'); } }));

['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { const dz = e.target.closest?.('#drop'); if (dz){ e.preventDefault(); dz.classList.add('over'); $('#dropTxt').textContent = 'Drop files here...'; } }));

document.addEventListener('submit', e => {

  const ti = $('#pTitle').value.trim(), de = $('#pDesc').value.trim();

const TEAM_LEAD = 'Siti Mariam';

  const free = AGENTS.filter(agentFree);
  if (!free.length){ t.assignee = ''; asgSet(t, 'lead', '', [`Schedule: no Service Desk agent free at ${stamp().slice(11)}`, `Sent to team lead ${TEAM_LEAD} to assign manually`]); return t; }
  const pick = free.map(a => [a, agentLoad(a)]).sort((x, y) => x[1] - y[1])[0];
  t.assignee = pick[0];
  asgSet(t, 'auto', 'Auto assign', [`Schedule: ${free.map(a => a.split(' ')[0]).join(' and ')} on shift (${AGENTS.filter(a => !agentFree(a) && a !== TEAM_LEAD).map(a => `${a.split(' ')[0]} ${AGENT_SHIFT[a].toLowerCase()}`).join(', ')})`,

    if (t.createdFrom || t.createdBy) return;
    const v = MIX[n++ % MIX.length];
    if (v === 'manual'){ t.createdBy = t.assignee && t.assignee !== TEAM_LEAD ? AGENTS.find(a => a !== t.assignee && a !== TEAM_LEAD) : 'Hafiz Zulkifli'; t.createdFrom = 'Agent Portal'; }
    else t.createdFrom = v === 'portal' ? 'Self Service' : 'Becky';
  });
  /* the end user's own tickets: some from the portal form, some from Becky chat */
  state.tickets.forEach((t, i) => { if (!t.createdFrom && !t.createdBy) t.createdFrom = i % 2 ? 'Becky' : 'Self Service'; });
})();
/* Sample data: how each existing ticket was assigned */
(() => {
  /* pattern repeats every 10 tickets: 5 auto, 3 manual, 2 reassigned */
  const MIX = ['auto','manual','auto','reassigned','auto','manual','auto','auto','reassigned','manual'];
  const fixed = { INC06025:'manual', INC06024:'reassigned', INC06021:'auto', INC06020:'manual' };
  let n = 0;
  allTickets().forEach(t => {
    if (t.assignBy) return;
    const at = (t.created || '').slice(11);
    if (!t.assignee){ if (isOpenT(t)) asgSet(t, 'lead', '', [`Schedule: no Service Desk agent free at ${at}`, `Sent to team lead ${TEAM_LEAD} to assign manually`]); return; }
    let how = fixed[t.no] || MIX[n++ % MIX.length];
    if (how === 'manual'){ const by = t.assignee === TEAM_LEAD ? t.assignee : TEAM_LEAD; asgSet(t, 'manual', by, [`Assigned manually by ${by}${by === TEAM_LEAD ? ' (team lead)' : ''}`]); return; }
    if (how === 'reassigned'){ const from = AGENTS.find(a => a !== t.assignee && a !== TEAM_LEAD), by = n % 2 ? TEAM_LEAD : t.assignee;
      asgSet(t, 'reassigned', by, [`First assigned to ${from} by auto assign`, `Changed to ${t.assignee} by ${by}${by === TEAM_LEAD ? ' (team lead)' : ''}`]); t.assignFrom = from; return; }
    asgSet(t, 'auto', 'Auto assign', [`Schedule: ${t.assignee} on shift at ${at}`, `Priority: ${t.priority}${['Critical','High'].includes(t.priority) ? ', handled first' : ''}`, `Workload: ${t.assignee} had the fewest open tickets in the group`]);
  });
})();
tkSeed();
(() => { const m = location.hash.match(/^#ticket=(.+)$/); if (m && findT(decodeURIComponent(m[1]))){ state.role = 'support'; state.view = 'sdetail'; state.ticketId = decodeURIComponent(m[1]); } })();
render();
</script>
